services:
  i-eupf:
    container_name: i-eupf
    image: ${EUPF_IMAGE:-ghcr.io/edgecomllc/eupf:main}
    privileged: true
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - ./config/ULCL/eupfcfg-i-upf.yaml:/config.yml
      - ./eupf/entrypoint-i-upf.sh:/app/bin/entrypoint.sh
    ulimits:
      memlock: -1
    environment:
      GIN_MODE: release
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - CAP_NET_ADMIN
      - CAP_BPF
    ports:
      - ${I_EUPF_PFCP_PORT}:8805/udp
      - ${I_EUPF_API_PORT}:8081
      - ${I_EUPF_METRICS_PORT}:9090
    restart: unless-stopped
    networks:
      privnet:
        ipv4_address: ${I_EUPF_IPV4_ADDRESS}
        aliases:
          - i-upf.free5gc.org
    sysctls:
      - net.ipv4.conf.all.forwarding=1
    depends_on:
      - psa-eupf

  psa-eupf:
    container_name: psa-eupf
    image: ${EUPF_IMAGE:-ghcr.io/edgecomllc/eupf:main}
    privileged: true
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - ./config/ULCL/eupfcfg-psa-upf.yaml:/config.yml
      - ./eupf/entrypoint.sh:/app/bin/entrypoint.sh
    ulimits:
      memlock: -1
    environment:
      GIN_MODE: release
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - CAP_NET_ADMIN
      - CAP_BPF
    ports:
      - ${PSA_EUPF_PFCP_PORT}:8805/udp
      - ${PSA_EUPF_API_PORT}:8081
      - ${PSA_EUPF_METRICS_PORT}:9090
    restart: unless-stopped
    networks:
      privnet:
        ipv4_address: ${PSA_EUPF_IPV4_ADDRESS}
        aliases:
          - psa-upf.free5gc.org
    sysctls:
      - net.ipv4.conf.all.forwarding=1

  db:
    container_name: mongodb
    image: ${MONGO_IMAGE:-mongo:4.4}
    command: mongod --port 27017 --quiet
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      privnet:
        aliases:
          - db

  free5gc-nrf:
    container_name: nrf
    image: free5gc/nrf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  free5gc-amf:
    container_name: amf
    image: free5gc/amf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - amf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-ausf:
    container_name: ausf
    image: free5gc/ausf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-nssf:
    container_name: nssf
    image: free5gc/nssf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-pcf:
    container_name: pcf
    image: free5gc/pcf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - free5gc-nrf

  free5gc-smf:
    container_name: smf
    image: free5gc/smf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ULCL/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/ULCL/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - smf.free5gc.org
    depends_on:
      - free5gc-nrf
      - i-eupf
      - psa-eupf

  free5gc-udm:
    container_name: udm
    image: free5gc/udm:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-udr:
    container_name: udr
    image: free5gc/udr:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-chf:
    container_name: chf
    image: free5gc/chf:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - free5gc-nrf
      - free5gc-webui

  free5gc-nef:
    container_name: nef
    image: free5gc/nef:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./nef -c ./config/nefcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nefcfg.yaml:/free5gc/config/nefcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      privnet:
        aliases:
          - nef.free5gc.org
    depends_on:
      - db
      - free5gc-nrf

  free5gc-webui:
    container_name: webui
    image: free5gc/webui:${FREE5GC_IMAGE_TAG:-v4.2.3}
    command: ./webui -c ./config/webuicfg.yaml
    expose:
      - "2122"
      - "2121"
    volumes:
      - ./config/webuicfg.yaml:/free5gc/config/webuicfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      privnet:
        aliases:
          - webui
    ports:
      - ${WEBUI_UI_PORT}:5000
      - ${WEBUI_PORT_2122}:2122
      - ${WEBUI_PORT_2121}:2121
    depends_on:
      - db
      - free5gc-nrf

  ueransim:
    container_name: ueransim
    image: free5gc/ueransim:${FREE5GC_ADDITIONAL_IMAGE_TAG:-latest}
    command: ./nr-gnb -c ./config/gnbcfg.yaml
    volumes:
      - ./config/gnbcfg.yaml:/ueransim/config/gnbcfg.yaml
      - ./config/ULCL/uecfg-ulcl.yaml:/ueransim/config/uecfg.yaml
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun"
    networks:
      privnet:
        aliases:
          - gnb.free5gc.org
    depends_on:
      - free5gc-amf
      - i-eupf
      - psa-eupf

  ue:
   container_name: ue
   image: free5gc/ueransim:latest
   command: ./nr-ue -c ./config/uecfg.yaml
   volumes:
     - ./config/ULCL/uecfg-ulcl.yaml:/ueransim/config/uecfg.yaml
   cap_add:
     - NET_ADMIN
   devices:
     - "/dev/net/tun"
   networks:
     privnet:
       aliases:
         - ue.free5gc.org
   depends_on:
     - ueransim

networks:
  privnet:
    ipam:
      driver: default
      config:
        - subnet: ${PRIVNET_SUBNET:-10.100.200.0/24}
    driver_opts:
      com.docker.network.bridge.name: ${PRIVNET_BRIDGE_NAME:-br-free5gc}

volumes:
  dbdata:
